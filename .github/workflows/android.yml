name: Android APK

# Kompilyatsiya **faqat qo'lda** ishga tushiriladi.
#
# Nega `push` olib tashlandi. Har bir push'da yig'ish odatiy hol edi, lekin
# loyiha hozir sinov bosqichida: o'zgarishlar ko'p, ularning har biri uchun
# yig'indi yasash bekorga resurs sarflaydi va shovqin ko'paytiradi.
# Shuning uchun avtomatik ishga tushirish o'chirildi — faqat shu faylning
# o'zi o'zgarganda ishga tushadi (`paths`). Bu ataylab: shu faylni tahrir
# qilib push qilish — yig'ishni boshlashning ishonchli yo'li, chunki
# qo'lda yuritish (`gh workflow run`) uchun tokenimizda `actions:write`
# huquqi yo'q (HTTP 403). Oddiy kod push'i yig'indi yasamaydi.
#
# Qo'lda yuritish ham mumkin: GitHub'ning «Actions» bo'limidan.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"

# Ish uchun faqat o'qish huquqi kerak: kodni yozmaydi, reliz yaratmaydi.
permissions:
  contents: read

# Bir shoxobchaga ketma-ket push bo'lsa, eski yurish bekor qilinadi —
# navbat to'planib qolmaydi va daqiqalar behuda ketmaydi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper JAR repoda saqlanmaydi (binary fayl), shuning uchun
      # Gradle to'g'ridan-to'g'ri o'rnatiladi va `gradle` buyrug'i chaqiriladi.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      # Til fayllari aapt2 dan oldin tekshiriladi: aapt2 qochirilmagan
      # apostrofni ushlaydi, lekin yetishmagan kalitni, tushib qolgan
      # `%1$s` ni va aralashgan yozuvni ushlamaydi — ular jim o'tadi.
      - name: Check locale files
        run: bash bin/verify-locales.sh

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Testlar yiqilsa ham hisobot saqlanadi — aks holda nima buzilganini
      # faqat logdan qidirishga to'g'ri keladi.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ovozstudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # TAJRIBA: R8 bilan siqilgan reliz. U debug'dan tezroq ishlaydi (kod
  # optimallashtiriladi), lekin hali sinalmagan — shuning uchun
  # `continue-on-error`: yiqilsa ham asosiy yig'ish (debug) buzilmaydi.
  # APK debug kaliti bilan imzolanadi: faqat tezlikni solishtirish uchun.
  release:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build fast release APK (R8)
        run: gradle assembleRelease -Povoz.fastRelease=true --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ovozstudio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
